name: Daily N-ADI v3 Auto Update

on:
  schedule:
    # 미국 장 마감 후 매일 아침 KST 07:30 (UTC 22:30, 화~토 실행)
    - cron: '30 22 * * 1-5'
  workflow_dispatch: # 수동 즉시 실행 버튼 활성화

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Run N-ADI v3 scraper & calculator
        run: python update_n_adi_v3.py

      - name: Commit and push updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "chore: update N-ADI v3 market data"
          git push
